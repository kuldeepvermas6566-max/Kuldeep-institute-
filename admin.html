<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand"><span class="badge" data-short-name>VC</span> Admin Panel</div>
    <button class="nav-cta" id="logout-btn" style="display:none;border:none;cursor:pointer;">Logout</button>
  </div>
</nav>

<!-- LOGIN -->
<div class="admin-login" id="login-box">
  <h2>Admin Login</h2>
  <p>Sirf institute owner/staff ke liye. Firebase Console mein banaya gaya email/password use karo.</p>
  <div class="field"><label>Email</label><input type="email" id="login-email"></div>
  <div class="field"><label>Password</label><input type="password" id="login-password"></div>
  <button class="btn btn-primary" style="width:100%;justify-content:center;" id="login-btn">Login</button>
  <div id="login-msg" class="form-msg"></div>
</div>

<!-- ADMIN CONTENT -->
<div class="admin-shell" id="admin-shell" style="display:none;">
  <div class="admin-topbar">
    <h2>Dashboard</h2>
  </div>

  <div class="admin-tabs">
    <div class="admin-tab active" data-tab="courses">Courses</div>
    <div class="admin-tab" data-tab="enquiries">Enquiries</div>
  </div>

  <!-- COURSES TAB -->
  <div class="admin-panel active" id="panel-courses">
    <div class="form-inline">
      <h4 id="form-mode-label">Naya Course Add Karo</h4>
      <input type="hidden" id="course-edit-key">
      <div class="row2">
        <div class="field"><label>Course Name *</label><input type="text" id="c-name"></div>
        <div class="field"><label>Short Code (jaise DCA)</label><input type="text" id="c-code"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Duration (jaise "6 Months")</label><input type="text" id="c-duration"></div>
        <div class="field"><label>Fee (jaise "₹800/month")</label><input type="text" id="c-fee"></div>
      </div>
      <div class="field">
        <label>Level (ladder order — 1 = pehla, 2 = uske baad...)</label>
        <input type="number" id="c-level" value="1" min="1">
      </div>
      <div class="field"><label>Description</label><textarea id="c-desc"></textarea></div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" id="save-course-btn">Save Course</button>
        <button class="btn btn-outline" id="cancel-edit-btn" style="display:none;color:var(--ink);border-color:var(--line);">Cancel</button>
      </div>
      <div id="course-form-msg" class="form-msg"></div>
    </div>

    <h4 style="margin-bottom:12px;">Existing Courses</h4>
    <div id="course-list"><p style="color:var(--ink-soft);">Loading…</p></div>
  </div>

  <!-- ENQUIRIES TAB -->
  <div class="admin-panel" id="panel-enquiries">
    <h4 style="margin-bottom:12px;">Student Enquiries</h4>
    <div id="enquiry-list"><p style="color:var(--ink-soft);">Loading…</p></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const auth = firebase.auth();

const loginBox = document.getElementById("login-box");
const adminShell = document.getElementById("admin-shell");
const logoutBtn = document.getElementById("logout-btn");

// ---- Auth state ----
auth.onAuthStateChanged(user => {
  if (user) {
    loginBox.style.display = "none";
    adminShell.style.display = "block";
    logoutBtn.style.display = "inline-flex";
    loadCourses();
    loadEnquiries();
  } else {
    loginBox.style.display = "block";
    adminShell.style.display = "none";
    logoutBtn.style.display = "none";
  }
});

document.getElementById("login-btn").addEventListener("click", () => {
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-password").value;
  const msg = document.getElementById("login-msg");
  auth.signInWithEmailAndPassword(email, pass)
    .catch(err => {
      msg.textContent = "Login fail: email ya password galat hai.";
      msg.className = "form-msg err";
      console.error(err);
    });
});

logoutBtn.addEventListener("click", () => auth.signOut());

// ---- Tabs ----
document.querySelectorAll(".admin-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".admin-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".admin-panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
  });
});

// ---- Courses CRUD ----
const courseListEl = document.getElementById("course-list");
const editKeyInput = document.getElementById("course-edit-key");
const formModeLabel = document.getElementById("form-mode-label");
const cancelEditBtn = document.getElementById("cancel-edit-btn");
const courseFormMsg = document.getElementById("course-form-msg");

function loadCourses() {
  firebase.database().ref("courses").on("value", snap => {
    const val = snap.val() || {};
    const courses = Object.keys(val).map(key => ({ key, ...val[key] }))
      .sort((a, b) => (a.level || 0) - (b.level || 0));

    if (courses.length === 0) {
      courseListEl.innerHTML = `<p style="color:var(--ink-soft);">Abhi koi course add nahi hua.</p>`;
      return;
    }

    courseListEl.innerHTML = courses.map(course => `
      <div class="course-row">
        <div class="info">
          <h4>${course.name} <span class="mono" style="color:var(--teal);">${course.code || ""}</span></h4>
          <span>Level ${course.level || 1} · ${course.duration || ""} · ${course.fee || ""}</span>
        </div>
        <div class="actions">
          <button class="icon-btn" onclick="editCourse('${course.key}')">Edit</button>
          <button class="icon-btn danger" onclick="deleteCourse('${course.key}')">Delete</button>
        </div>
      </div>
    `).join("");
  });
}

document.getElementById("save-course-btn").addEventListener("click", () => {
  const data = {
    name: document.getElementById("c-name").value.trim(),
    code: document.getElementById("c-code").value.trim(),
    duration: document.getElementById("c-duration").value.trim(),
    fee: document.getElementById("c-fee").value.trim(),
    level: parseInt(document.getElementById("c-level").value) || 1,
    desc: document.getElementById("c-desc").value.trim()
  };

  if (!data.name) {
    courseFormMsg.textContent = "Course name zaroori hai.";
    courseFormMsg.className = "form-msg err";
    return;
  }

  const key = editKeyInput.value;
  const ref = key ? firebase.database().ref("courses/" + key) : firebase.database().ref("courses").push();

  ref.set(data).then(() => {
    courseFormMsg.textContent = "Course save ho gaya!";
    courseFormMsg.className = "form-msg ok";
    resetCourseForm();
  }).catch(err => {
    courseFormMsg.textContent = "Save nahi hua, dobara try karo.";
    courseFormMsg.className = "form-msg err";
    console.error(err);
  });
});

function resetCourseForm() {
  editKeyInput.value = "";
  document.getElementById("c-name").value = "";
  document.getElementById("c-code").value = "";
  document.getElementById("c-duration").value = "";
  document.getElementById("c-fee").value = "";
  document.getElementById("c-level").value = "1";
  document.getElementById("c-desc").value = "";
  formModeLabel.textContent = "Naya Course Add Karo";
  cancelEditBtn.style.display = "none";
}

cancelEditBtn.addEventListener("click", resetCourseForm);

window.editCourse = function(key) {
  firebase.database().ref("courses/" + key).once("value").then(snap => {
    const course = snap.val();
    if (!course) return;
    editKeyInput.value = key;
    document.getElementById("c-name").value = course.name || "";
    document.getElementById("c-code").value = course.code || "";
    document.getElementById("c-duration").value = course.duration || "";
    document.getElementById("c-fee").value = course.fee || "";
    document.getElementById("c-level").value = course.level || 1;
    document.getElementById("c-desc").value = course.desc || "";
    formModeLabel.textContent = "Course Edit Karo";
    cancelEditBtn.style.display = "inline-flex";
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
};

window.deleteCourse = function(key) {
  if (!confirm("Ye course delete karna hai? Ye undo nahi ho sakta.")) return;
  firebase.database().ref("courses/" + key).remove();
};

// ---- Enquiries ----
function loadEnquiries() {
  const el = document.getElementById("enquiry-list");
  firebase.database().ref("enquiries").on("value", snap => {
    const val = snap.val() || {};
    const items = Object.keys(val).map(key => ({ key, ...val[key] }))
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    if (items.length === 0) {
      el.innerHTML = `<p style="color:var(--ink-soft);">Abhi koi enquiry nahi aayi.</p>`;
      return;
    }

    el.innerHTML = items.map(item => `
      <div class="enquiry-row">
        <h4>${item.name || "—"} · ${item.phone || "—"}</h4>
        <p>Course: ${item.course || "—"}${item.email ? " · " + item.email : ""}</p>
        ${item.message ? `<p>"${item.message}"</p>` : ""}
        <p style="opacity:0.7;">${item.createdAt ? new Date(item.createdAt).toLocaleString() : ""}</p>
      </div>
    `).join("");
  }, err => {
    el.innerHTML = `<p style="color:#c0392b;">Enquiries load nahi hui — read permission check karo.</p>`;
    console.error(err);
  });
}
</script>
</body>
</html>
