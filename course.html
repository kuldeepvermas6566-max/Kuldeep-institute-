<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Course Details</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand"><span class="badge" data-short-name>VC</span> <span data-institute-name>Institute</span></div>
    <div class="nav-links">
      <a href="index.html#about">About</a>
      <a href="index.html#courses">Courses</a>
      <a href="index.html#branches">Branches</a>
      <a href="index.html#contact">Contact</a>
    </div>
    <a class="nav-cta" href="index.html#contact">Enquire Now</a>
  </div>
</nav>

<header class="course-hero">
  <div class="wrap">
    <a href="index.html#courses" class="back-link">← Saare courses dekho</a>
    <div id="course-detail-head">
      <h1>Loading…</h1>
    </div>
    <div class="course-meta-row" id="course-meta-row"></div>
  </div>
</header>

<section class="course-body wrap">
  <p id="course-desc">Course details load ho raha hai…</p>
  <div class="course-cta">
    <a href="index.html#contact" class="btn btn-primary">Enquiry Karo</a>
    <a data-tel-link href="tel:" class="btn btn-outline">📞 Call Now</a>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-bottom">© <span data-year></span> <span data-institute-name>Institute</span>. All rights reserved.</div>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="firebase-config.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const c = SITE_CONFIG;
  document.querySelectorAll("[data-institute-name]").forEach(el => el.textContent = c.instituteName);
  document.querySelectorAll("[data-short-name]").forEach(el => el.textContent = c.shortName);
  document.querySelectorAll("[data-year]").forEach(el => el.textContent = new Date().getFullYear());
  document.querySelectorAll("[data-tel-link]").forEach(el => el.href = `tel:${c.phone.replace(/\s/g, "")}`);

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const headEl = document.getElementById("course-detail-head");
  const metaEl = document.getElementById("course-meta-row");
  const descEl = document.getElementById("course-desc");

  if (!id || typeof db === "undefined") {
    headEl.innerHTML = "<h1>Course nahi mila</h1>";
    descEl.textContent = "";
    return;
  }

  db.ref("courses/" + id).once("value").then(snap => {
    const course = snap.val();
    if (!course) {
      headEl.innerHTML = "<h1>Course nahi mila</h1>";
      descEl.textContent = "Ye course available nahi hai. Saare courses dekhne ke liye upar wala link use karo.";
      return;
    }
    document.getElementById("page-title").textContent = course.name;
    headEl.innerHTML = `<h1>${course.name}</h1>`;
    metaEl.innerHTML = `
      <span class="chip">📚 ${course.duration || ""}</span>
      <span class="chip">💰 ${course.fee || ""}</span>
      ${course.code ? `<span class="chip mono">${course.code}</span>` : ""}
    `;
    descEl.textContent = course.desc || "";
  }).catch(err => {
    headEl.innerHTML = "<h1>Kuch galat ho gaya</h1>";
    console.error(err);
  });
});
</script>
</body>
</html>
